[project]
name = "finance-rag"
version = "0.1.0"
description = "财报问答系统：带引用、拒答和评测的 RAG 项目"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "numpy>=2.5.4",
    "openai>=1.60,<3",
    "opencc-python-reimplemented>=0.1.7",
    "pymupdf>=2.1",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
