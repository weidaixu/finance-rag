<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>财报问答 · 让答案回到原文</title>
  <style>
    :root { --paper:#f4f7fa; --ink:#172c40; --muted:#546679; --line:#d7e1e9; --blue:#235b83; --pale:#eaf2f8; --green:#17644d; --amber:#854708; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.7 "Segoe UI","Microsoft YaHei",sans-serif; }
    button,textarea { font:inherit; }
    button,a,textarea { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    button:disabled { cursor:wait; opacity:.6; }
    :focus-visible { outline:3px solid #458dbd; outline-offset:4px; }
    [hidden] { display:none !important; }
    .shell { width:min(1100px,100%); margin:auto; padding:0 32px; }
    header { border-bottom:1px solid var(--line); background:#fff; }
    .masthead { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:21px; padding-bottom:21px; }
    .brand { font-weight:700; font-size:19px; letter-spacing:.08em; }
    .brand span { color:var(--blue); margin-right:10px; }
    .header-note { color:var(--muted); font-size:13px; }
    main { padding-top:48px !important; padding-bottom:48px !important; }
    h1 { font:600 clamp(28px,4.6vw,40px)/1.35 "Segoe UI","Microsoft YaHei",sans-serif; letter-spacing:-.02em; margin:0 0 13px; }
    .intro { margin:0 0 30px; color:var(--muted); max-width:710px; }
    .workspace { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:26px; align-items:start; }
    .primary,.evidence { min-width:0; }
    form { background:#fff; border:1px solid var(--line); border-radius:12px; padding:23px; }
    label { display:block; font-weight:600; margin-bottom:12px; }
    textarea { display:block; resize:vertical; min-height:96px; width:100%; border:0; color:var(--ink); background:transparent; padding:0; line-height:1.7; }
    textarea::placeholder { color:#6b7c8b; }
    textarea:focus { outline:0; }
    form:focus-within { border-color:var(--blue); box-shadow:0 0 0 2px var(--pale); }
    .form-bottom { display:flex; justify-content:space-between; align-items:center; gap:12px; border-top:1px solid var(--line); margin-top:14px; padding-top:16px; }
    #count { color:var(--muted); font:12px/1.4 Consolas,monospace; }
    #submit { border:0; border-radius:6px; background:var(--blue); color:white; padding:10px 19px; font-weight:600; }
    .privacy { margin:10px 0 0; font-size:12px; color:var(--muted); }
    .examples { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 26px; }
    .examples button { border:1px solid var(--line); border-radius:5px; padding:6px 10px; background:transparent; color:var(--muted); font-size:12px; }
    .examples button:hover { background:#fff; border-color:var(--blue); color:var(--blue); }
    .section-title { font-size:15px; font-weight:600; margin:0; }
    .answer-head { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:0 0 13px; border-bottom:1px solid var(--line); }
    .head-tools { display:flex; align-items:center; gap:12px; min-width:0; }
    #status { font-size:12px; color:var(--muted); }
    #new-chat { border:1px solid var(--line); border-radius:5px; padding:4px 10px; background:#fff; color:var(--blue); font-size:12px; }
    .placeholder { color:var(--muted); font-size:14px; padding:19px 0; }
    #messages { display:flex; flex-direction:column; gap:16px; padding:19px 0; }
    #messages:empty { padding:0; }
    .msg { max-width:100%; min-width:0; }
    .msg.user { align-self:flex-end; max-width:88%; }
    .msg.user .bubble { background:var(--blue); color:#fff; border-radius:12px 12px 2px 12px; padding:10px 15px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .msg.assistant { align-self:flex-start; width:100%; }
    .msg.assistant .bubble { background:#fff; border:1px solid var(--line); border-radius:12px 12px 12px 2px; padding:12px 16px; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.95; min-height:48px; }
    .rewritten { font-size:12px; color:var(--muted); margin:0 0 4px 4px; overflow-wrap:anywhere; }
    .citation { display:inline; border:0; color:var(--blue); background:var(--pale); font-weight:700; padding:1px 5px; border-radius:3px; margin:0 2px; }
    .notice { padding:10px 14px; border-radius:6px; font-size:14px; overflow-wrap:anywhere; margin-top:8px; }
    .notice.partial,.notice.warning { background:#fff2d9; color:var(--amber); border-left:3px solid #c77d20; }
    #error { background:#fff0ed; color:#9a3b29; margin:12px 0 0; }
    .usage { font-size:12px; color:var(--muted); padding:6px 4px 0; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
    .evidence { background:#fff; border:1px solid var(--line); border-top:3px solid var(--green); border-radius:0 0 8px 8px; padding:22px; }
    .evidence h2 { margin-bottom:12px; }
    .evidence p { color:var(--muted); font-size:13px; margin:8px 0 14px; }
    #source-list { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
    #source-list button { border:1px solid var(--line); padding:4px 10px; color:var(--blue); border-radius:4px; background:#fff; }
    #source-list button[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:#fff; }
    #source-title { font-size:15px; line-height:1.6; margin:0; overflow-wrap:anywhere; }
    #source-meta { font-size:12px; color:var(--muted); margin:8px 0 15px; overflow-wrap:anywhere; }
    blockquote { margin:0; padding:14px 0 14px 15px; border-left:2px solid var(--line); white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px; color:#344d60; max-height:460px; overflow:auto; }
    #pdf-link { display:inline-block; margin-top:17px; color:var(--green); font-size:13px; text-underline-offset:4px; overflow-wrap:anywhere; }
    footer { margin-top:32px; padding-top:18px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
    @media(max-width:700px) { .shell { padding-left:19px; padding-right:19px; } main { padding-top:30px !important; } .workspace { grid-template-columns:minmax(0,1fr); gap:24px; } .header-note { font-size:11px; } form,.evidence { padding:18px; } .form-bottom { flex-wrap:wrap; } blockquote { max-height:340px; } .msg.user { max-width:96%; } }
  </style>
</head>
<body>
  <header><div class="shell masthead"><div class="brand"><span aria-hidden="true">▤</span>财报问答</div><span class="header-note">公开财报 · 可追溯引用</span></div></header>
  <main class="shell">
    <h1>让答案回到原文。</h1>
    <p class="intro">用中文或英文询问财报，可以接着上一个问题继续追问。阅读回答，点击引用，再到 PDF 中核对；资料不足时，我们会说明原因。</p>
    <div class="workspace">
      <section class="primary" aria-label="财报对话">
        <div class="answer-head"><h2 class="section-title">对话</h2><div class="head-tools"><span id="status" role="status" aria-live="polite">等待提问</span><button id="new-chat" type="button">新对话</button></div></div>
        <div id="error" class="notice" role="alert" hidden></div>
        <p id="empty" class="placeholder">从一个具体问题开始。答案中的引用会带你找到原文。</p>
        <div id="messages" role="log" aria-live="polite" aria-busy="false"></div>
        <form id="ask-form">
          <label for="question">你想了解什么？</label>
          <textarea id="question" rows="3" placeholder="写清公司、年份和你想了解的指标或业务；也可以直接追问，如“那利润呢？”。" aria-describedby="count" required></textarea>
          <div class="form-bottom"><span id="count">0 / 500 字</span><button id="submit" type="submit">查阅财报 →</button></div>
        </form>
        <p id="privacy-note" class="privacy">对话记录保存在服务器上，7 天后自动删除，请不要输入个人敏感信息。</p>
        <div class="examples" aria-label="提问示例"><button type="button">宁德时代有哪些主要业务？</button><button type="button">What products does Tesla offer?</button></div>
      </section>
      <aside id="evidence" class="evidence" tabindex="-1" aria-label="引用原文">
        <h2 class="section-title">原文证据</h2>
        <p id="source-empty">回答完成后，点击答案中的 [编号]，在这里查看对应原文。</p>
        <div id="source-list" hidden></div>
        <div id="source-detail" hidden><h3 id="source-title"></h3><div id="source-meta"></div><blockquote id="source-text"></blockquote><a id="pdf-link" target="_blank" rel="noopener noreferrer">打开 PDF 核对 ↗</a></div>
      </aside>
    </div>
    <footer>只依据公开财报回答，不构成投资建议。引用页码为 PDF 物理页码，可能与报告印刷页码不同。费用为估算值。</footer>
  </main>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const form = $('ask-form'), question = $('question'), submit = $('submit');
    const status = $('status'), messages = $('messages');
    const STORAGE_KEY = 'finrag.session_id';
    const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    let busy = false, activeMessage = null, messageCount = 0;
    const reasons = {
      investment_advice: '无法提供股票买卖或投资建议。可以询问财报已披露的经营和财务事实。',
      year_not_covered: '该年份超出了现有财报的覆盖范围，请调整年份。',
      no_evidence: '没有找到足够的财报证据。请写清公司、年份或具体指标后再试。',
      model_insufficient: '现有资料不足以回答这个问题，无法给出可靠结论。',
      no_valid_citation: '生成内容缺少有效引用，已撤回，无法提供有据可查的回答。',
      saved_error: '这一轮回答生成失败。'
    };

    // ---- 会话 ID：优先用 localStorage 里的，读写失败时只保存在内存里 ----
    function newSessionId() {
      try { return crypto.randomUUID(); } catch (_) { /* 非安全上下文没有 randomUUID */ }
      const b = crypto.getRandomValues(new Uint8Array(16));
      b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
      const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
      return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
    }
    function rememberSessionId(id) { try { localStorage.setItem(STORAGE_KEY, id); } catch (_) { /* 存不了就只在内存里 */ } }
    function loadSessionId() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (typeof saved === 'string' && UUID.test(saved)) return saved;
      } catch (_) { /* 读不到就新建 */ }
      const id = newSessionId(); rememberSessionId(id); return id;
    }
    let sessionId = loadSessionId();

    function count() { $('count').textContent = `${Array.from(question.value.trim()).length} / 500 字`; }
    question.addEventListener('input', count);
    function el(tag, className, text) {
      const node = document.createElement(tag); node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function scrollToEnd(node) { if (node && typeof node.scrollIntoView === 'function') node.scrollIntoView({block: 'end'}); }

    // ---- 右侧原文证据栏：显示某一条回答的引用 ----
    function clearSources() {
      activeMessage = null; $('source-list').replaceChildren(); $('source-list').hidden = true;
      $('source-detail').hidden = true; $('source-empty').hidden = false;
      $('pdf-link').removeAttribute('href'); $('source-text').textContent = '';
    }
    function showSource(msg, n, focus = false) {
      const source = msg.citations.get(n);
      if (!source) return;
      if (activeMessage !== msg) {
        clearSources(); activeMessage = msg; $('source-list').hidden = false;
        for (const [key] of msg.citations) {
          const button = document.createElement('button'); button.type = 'button'; button.dataset.n = key;
          button.textContent = `[${key}]`; button.setAttribute('aria-label', `查看引用 ${key}`);
          button.addEventListener('click', () => showSource(msg, key)); $('source-list').append(button);
        }
      }
      $('source-empty').hidden = true; $('source-detail').hidden = false;
      $('source-title').textContent = source.title;
      $('source-meta').textContent = `PDF 第 ${source.page} 页 · ${source.section || '正文'} · ${source.kind === 'table' ? '表格' : '文字'}`;
      $('source-text').textContent = source.text;
      $('pdf-link').href = `/api/pdf/${encodeURIComponent(source.doc_id)}#page=${source.page}`;
      for (const button of $('source-list').children) button.setAttribute('aria-pressed', String(Number(button.dataset.n) === n));
      if (focus) $('evidence').focus();
    }

    // ---- 对话列表 ----
    function addUser(text) {
      const root = el('article', 'msg user'); root.append(el('div', 'bubble', text));
      messages.append(root); $('empty').hidden = true; messageCount++; scrollToEnd(root);
    }
    function addAssistant() {
      const msg = {root: el('article', 'msg assistant'), note: el('div', 'rewritten'), bubble: el('div', 'bubble'),
        partial: el('div', 'notice partial'), warning: el('div', 'notice warning'), usage: el('div', 'usage'), citations: new Map()};
      msg.warning.setAttribute('role', 'alert');
      msg.note.hidden = msg.partial.hidden = msg.warning.hidden = msg.usage.hidden = true;
      msg.root.append(msg.note, msg.bubble, msg.partial, msg.warning, msg.usage);
      messages.append(msg.root); $('empty').hidden = true; messageCount++;
      return msg;
    }
    function setRewritten(msg, text) {
      if (typeof text !== 'string' || !text) return;
      msg.note.textContent = `我理解的问题是：${text}`; msg.note.hidden = false;
    }
    function renderAnswer(msg, text) {
      msg.bubble.replaceChildren();
      let offset = 0;
      for (const match of text.matchAll(/\[(\d+)\]/g)) {
        msg.bubble.append(document.createTextNode(text.slice(offset, match.index)));
        const n = Number(match[1]);
        if (msg.citations.has(n)) {
          const button = document.createElement('button');
          button.type = 'button'; button.className = 'citation'; button.textContent = match[0];
          button.setAttribute('aria-label', `查看引用 ${n} 的原文`);
          button.addEventListener('click', () => showSource(msg, n, true)); msg.bubble.append(button);
        } else msg.bubble.append(document.createTextNode(match[0]));
        offset = match.index + match[0].length;
      }
      msg.bubble.append(document.createTextNode(text.slice(offset)));
    }
    // 请求失败：撤掉这条未完成的回答，只显示通用提示，不显示服务端返回的内部信息。
    function fail(msg, message) {
      if (msg) { msg.bubble.textContent = ''; msg.root.hidden = true; }
      if (activeMessage === msg) clearSources();
      $('error').textContent = message; $('error').hidden = false; status.textContent = '未完成';
    }
    function finish(msg, data) {
      const usage = data.usage || {};
      if (Number.isFinite(usage.input_tokens) && Number.isFinite(usage.output_tokens) && Number.isFinite(usage.cost_yuan)) {
        msg.usage.textContent = `输入 ${usage.input_tokens} Token · 输出 ${usage.output_tokens} Token · 估算费用 ¥${usage.cost_yuan.toFixed(6)}`;
        msg.usage.hidden = false;
      }
      if (data.error) { fail(msg, '回答生成失败，请稍后重试。'); return false; }
      setRewritten(msg, data.rewritten);
      if (data.refused) {
        msg.bubble.textContent = reasons[data.refusal_reason] || '现有财报证据不足，无法可靠回答。请调整问题后重试。';
        status.textContent = '未作答'; return true;
      }
      msg.citations = new Map();
      for (const source of data.citations || []) {
        if (!Number.isSafeInteger(source.n) || source.n < 1 || !Number.isSafeInteger(source.page) || source.page < 1 || typeof source.doc_id !== 'string') continue;
        msg.citations.set(source.n, source);
      }
      renderAnswer(msg, typeof data.answer === 'string' ? data.answer : '');
      if (msg.citations.size) showSource(msg, msg.citations.keys().next().value);
      const numbers = data.unverified_numbers || [];
      if (numbers.length) {
        msg.warning.textContent = `请核对：这些数字没有在引用原文里找到：${numbers.join('、')}。请勿直接使用。`;
        msg.warning.hidden = false;
      }
      if (data.partial === true) {
        msg.partial.textContent = '部分内容没有找到依据，请以引用原文为准。'; msg.partial.hidden = false;
      }
      status.textContent = data.clarify === true ? '需要补充信息' : '回答完成';
      return true;
    }

    // A fetch chunk may end anywhere, including inside UTF-8 characters or SSE frames.
    async function readEvents(response, msg) {
      if (!response.body) throw new Error('Missing stream');
      const reader = response.body.getReader(), decoder = new TextDecoder('utf-8');
      let buffer = '', completed = false;
      function dispatch(frame) {
        let event = '', lines = [];
        for (const line of frame.split(/\r?\n/)) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          if (line.startsWith('data:')) lines.push(line.slice(5).replace(/^ /, ''));
        }
        if (!lines.length || completed) return;
        const data = JSON.parse(lines.join('\n'));
        if (event === 'token' && typeof data.text === 'string') {
          msg.bubble.append(document.createTextNode(data.text)); status.textContent = '生成中，等待核对';
        } else if (event === 'rewritten') {
          setRewritten(msg, data.question); status.textContent = '正在查找证据';
        } else if (event === 'done') { finish(msg, data); completed = true; }
      }
      try {
        while (!completed) {
          const part = await reader.read();
          buffer += decoder.decode(part.value || new Uint8Array(), {stream: !part.done});
          let boundary;
          while ((boundary = /\r?\n\r?\n/.exec(buffer)) !== null) {
            dispatch(buffer.slice(0, boundary.index)); buffer = buffer.slice(boundary.index + boundary[0].length);
          }
          if (part.done) {
            if (buffer.trim()) dispatch(buffer);
            if (!completed) throw new Error('Stream ended without done');
            break;
          }
        }
      } finally { await reader.cancel(); reader.releaseLock(); }
    }
    // 429 时服务端返回中文提示 {"message": ...}；解析失败就用默认文案。结果只用 textContent 显示。
    async function failureMessage(response) {
      if (response.status === 422) return '请输入 1–500 字的问题。';
      if (response.status === 429) {
        try {
          const body = await response.json();
          if (body && typeof body.message === 'string' && body.message.trim()) return body.message.trim().slice(0, 200);
        } catch (_) { /* 响应体不是 JSON */ }
        return '请求太频繁，请稍后再试。';
      }
      return '请求失败，请稍后重试。';
    }
    function setBusy(value) {
      busy = value; submit.disabled = value; submit.textContent = value ? '正在查阅…' : '查阅财报 →';
      $('new-chat').disabled = value; messages.setAttribute('aria-busy', String(value));
      for (const button of document.querySelectorAll('.examples button')) button.disabled = value;
    }
    form.addEventListener('submit', async event => {
      event.preventDefault(); if (busy) return;
      const text = question.value.trim();
      if (!text || Array.from(text).length > 500) { $('error').textContent = '请输入 1–500 字的问题。'; $('error').hidden = false; question.focus(); return; }
      setBusy(true); $('error').hidden = true; status.textContent = '正在查找证据';
      addUser(text); question.value = ''; count();
      const msg = addAssistant();
      const controller = new AbortController(), timeout = setTimeout(() => controller.abort(), 120000);
      try {
        const response = await fetch('/api/ask', {method: 'POST', headers: {'Content-Type': 'application/json', 'Accept': 'text/event-stream'}, body: JSON.stringify({question: text, session_id: sessionId}), signal: controller.signal});
        if (!response.ok) { fail(msg, await failureMessage(response)); return; }
        await readEvents(response, msg);
      } catch (error) {
        fail(msg, error.name === 'AbortError' ? '请求超时，请稍后重试。' : '连接中断，回答未完成。请重试。');
      } finally {
        clearTimeout(timeout); setBusy(false);
        if ($('error').hidden === false && !question.value) { question.value = text; count(); }
        scrollToEnd(msg.root.hidden ? null : msg.root);
      }
    });

    // ---- 恢复历史和新对话 ----
    function turnToDone(turn) {
      const status = turn.status;
      return {answer: typeof turn.answer === 'string' ? turn.answer : '', refused: status === 'refused' || status === 'error',
        refusal_reason: status === 'error' ? 'saved_error' : '', error: '', citations: Array.isArray(turn.citations) ? turn.citations : [],
        unverified_numbers: [], partial: false, clarify: status === 'clarify', rewritten: turn.rewritten};
    }
    async function loadHistory() {
      try {
        const response = await fetch(`/api/session/${encodeURIComponent(sessionId)}`);
        if (!response.ok) return;
        const body = await response.json();
        if (!body || !Array.isArray(body.turns) || !body.turns.length || messageCount > 0) return;
        for (const turn of body.turns) {
          if (typeof turn.question !== 'string') continue;
          addUser(turn.question); finish(addAssistant(), turnToDone(turn));
        }
        status.textContent = `已恢复 ${body.turns.length} 轮对话`;
        scrollToEnd(messages.children[messages.children.length - 1]);
      } catch (_) { /* 没有历史或服务暂时不可用时，从空白对话开始 */ }
    }
    $('new-chat').addEventListener('click', () => {
      if (busy) return;
      const old = sessionId; sessionId = newSessionId(); rememberSessionId(sessionId);
      messages.replaceChildren(); messageCount = 0; $('empty').hidden = false; clearSources();
      $('error').hidden = true; status.textContent = '等待提问';
      fetch(`/api/session/${encodeURIComponent(old)}`, {method: 'DELETE'}).catch(() => {});
      question.focus();
    });
    for (const button of document.querySelectorAll('.examples button')) button.addEventListener('click', () => { question.value = button.textContent; count(); question.focus(); });
    const ready = loadHistory();
  </script>
</body>
</html>
